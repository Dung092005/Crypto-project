[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "broadcastguard"
version = "0.1.0"
description = "Educational RSA broadcast attack and defense labs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["cryptography>=42.0.0,<50", "streamlit>=1.60,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
analysis = ["matplotlib>=3.8,<4", "numpy>=1.26,<3"]

[tool.setuptools.packages.find]
include = ["broadcastguard*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
