[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "broadcastguard"
version = "0.1.0"
description = "Educational RSA broadcast attack and defense labs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=42.0.0,<50", "streamlit>=1.60,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["broadcastguard*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
